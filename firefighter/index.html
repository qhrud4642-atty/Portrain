<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff6b4a">
<title>꼬마 소방관</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#ffb199;color:#3a2010;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;left:0;right:0;top:0;bottom:18px;display:flex;align-items:center;justify-content:center}
#game{display:block;touch-action:none;border-radius:6px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(6px,1.5vh) max(10px,3vw);background:rgba(255,243,230,.97);overflow:auto;z-index:20}
.ov.show{display:flex}
.box{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.6vh,14px);margin:auto}
.bear{width:clamp(48px,16vh,120px);height:clamp(48px,16vh,120px);flex:none}
h1{font-size:clamp(20px,7vh,44px);line-height:1.1;color:#d63a1a;text-align:center}
.sub{font-size:clamp(12px,3.6vh,20px);text-align:center;line-height:1.35}
.map{display:flex;flex-direction:column;gap:clamp(3px,1.2vh,10px);width:100%}
.chap{display:flex;align-items:center;gap:clamp(4px,1vw,10px)}
.chap .cl{width:clamp(44px,9vw,90px);flex:none;text-align:center;font-weight:800;font-size:clamp(11px,3.2vh,17px);line-height:1.15}
.chap .cl b{display:block;font-size:clamp(18px,6vh,32px)}
.sb{flex:1 1 0;min-width:0;background:#fff;border-radius:14px;border:3px solid #ffb48a;box-shadow:0 3px 0 #e8875a;
  padding:clamp(2px,.9vh,8px) 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sb:active{transform:translateY(2px);box-shadow:0 1px 0 #e8875a}
.sb .n{font-size:clamp(11px,3vh,15px);font-weight:800;color:#d63a1a}
.sb .i{font-size:clamp(18px,6vh,34px)}
.sb .s{font-size:clamp(8px,2.4vh,13px);min-height:1.1em;letter-spacing:-1px}
.sb.lock{background:#eee;border-color:#ccc;box-shadow:0 3px 0 #bbb;opacity:.75}
.sb.next{border-color:#ff5a2a;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.lbl{font-size:clamp(11px,3.4vh,17px);font-weight:700;color:#8a4a2a}
.row{display:flex;gap:clamp(6px,1.6vw,14px);width:100%;justify-content:center;flex-wrap:nowrap;align-items:center}
.mode{flex:0 1 220px;min-width:0;padding:clamp(4px,1.5vh,10px) 6px;border-radius:999px;background:#fff;
  border:3px solid #e0c8b8;font-size:clamp(12px,3.6vh,18px);font-weight:700;white-space:nowrap}
.mode.on{background:#ffcf33;border-color:#e09b00}
.small{background:none;font-size:clamp(10px,2.8vh,14px);color:#9a6a4a;text-decoration:underline;padding:4px 8px}
.btn{padding:clamp(7px,2.4vh,14px) clamp(14px,3vw,28px);border-radius:999px;background:#ffcf33;font-weight:800;
  font-size:clamp(14px,4.6vh,22px);box-shadow:0 4px 0 #d48a00;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d48a00}
.btn.gray{background:#eee;box-shadow:0 4px 0 #bbb}
.btn.red{background:#ff6b4a;color:#fff;box-shadow:0 4px 0 #b83a1a}
.talk{display:flex;align-items:center;gap:clamp(8px,2vw,20px);width:100%}
.bub{flex:1;background:#fff;border:3px solid #ffb48a;border-radius:20px;padding:clamp(8px,2.6vh,18px) clamp(10px,2vw,20px);
  font-size:clamp(15px,5vh,26px);line-height:1.4;font-weight:600}
.err .ic{font-size:clamp(30px,12vh,60px)}
.err h2{font-size:clamp(17px,6vh,30px);text-align:center;color:#c0392b}
.err ol{font-size:clamp(13px,4vh,19px);line-height:1.45;padding-left:1.4em;max-width:760px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stars{font-size:clamp(30px,13vh,70px);letter-spacing:6px}
#home{position:fixed;left:max(6px,env(safe-area-inset-left));top:6px;z-index:5;width:clamp(36px,11vh,52px);height:clamp(36px,11vh,52px);
  border-radius:50%;background:rgba(255,255,255,.85);font-size:clamp(18px,6vh,26px);display:none}
#bubble{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:8px;
  max-width:min(70vw,720px);background:#fff;border:3px solid #ffb48a;border-radius:18px;padding:4px 14px 4px 6px;
  font-size:clamp(13px,4.4vh,20px);font-weight:700;line-height:1.3;box-shadow:0 3px 8px rgba(0,0,0,.15);pointer-events:none}
#bubble svg{width:clamp(30px,10vh,48px);height:clamp(30px,10vh,48px);flex:none}
#toast{position:fixed;left:50%;bottom:clamp(26px,9vh,44px);transform:translateX(-50%);z-index:7;display:none;background:#333;color:#fff;
  padding:8px 16px;border-radius:12px;font-size:clamp(12px,3.8vh,17px);max-width:86vw;text-align:center}

  background:rgba(0,0,0,.55);padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#rotate{z-index:25;background:rgba(40,40,40,.93);color:#fff}
#rotate .sub{color:#fff}
#video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
a.link{color:#8a4a2a;font-size:clamp(11px,3vh,15px)}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<video id="video" playsinline muted autoplay></video>
<button id="home" aria-label="지도로">🗺️</button>
<div id="bubble"><span class="bslot"></span><span id="bubbleText"></span></div>
<div id="toast"></div>

<!-- 지도(메뉴) -->
<div class="ov show" id="menu"><div class="box">
  <div class="talk" style="justify-content:center;width:auto">
    <span class="bslot bear"></span>
    <div><h1>꼬마 소방관 🚒</h1><div class="sub">곰 대장님과 불을 끄고 친구들을 구해요!</div></div>
  </div>
  <div class="map" id="map"></div>
  <div class="row">
    <span class="lbl">조작:</span>
    <button class="mode on" data-m="camera">✋ 손으로 하기</button>
    <button class="mode" data-m="finger">👆 손가락으로</button>
  </div>
  <div class="row"><button class="small" id="unlockAll">부모님용: 모든 단계 열기</button><a class="link" href="../">🚜 포크레인 게임</a></div>
</div></div>

<!-- 단계 소개 -->
<div class="ov" id="intro"><div class="box">
  <div class="sub" id="introTitle" style="font-weight:800;color:#d63a1a"></div>
  <div class="talk"><span class="bslot bear"></span><div class="bub" id="introText"></div></div>
  <div class="sub" id="introHow"></div>
  <div class="btns"><button class="btn gray" id="introSay">🔊 다시 듣기</button><button class="btn red" id="introGo">출동! 🚒</button></div>
</div></div>

<!-- 성공 -->
<div class="ov" id="win"><div class="box">
  <div class="stars" id="winStars"></div>
  <div class="talk"><span class="bslot bear"></span><div class="bub" id="winText"></div></div>
  <div class="btns"><button class="btn gray" id="winHome">🗺️ 지도</button><button class="btn gray" id="winAgain">↻ 다시 하기</button><button class="btn red" id="winNext">다음 단계 ▶</button></div>
</div></div>

<!-- 카메라 안내 -->
<div class="ov err" id="camerr"><div class="box">
  <div class="ic" id="ceIcon">📷</div>
  <h2 id="ceTitle"></h2>
  <ol id="ceSteps"></ol>
  <div class="btns" id="ceBtns"></div>
</div></div>

<div class="ov" id="rotate"><div class="box">
  <div style="font-size:clamp(40px,14vw,90px)">📱↻</div>
  <h1 style="color:#ffd54f">휴대폰을 가로로 돌려 주세요</h1>
  <div class="sub">가로 화면에서 더 크게 볼 수 있어요</div>
  <button class="btn" id="rotateSkip">그냥 할래요</button>
</div></div>

<div id="diag">진단: 시작 전</div>

// ================= One-Euro 필터 =================
class OneEuro{
  constructor(minC=1.2,beta=0.008,dC=1){this.minC=minC;this.beta=beta;this.dC=dC;this.reset()}
  reset(){this.x=null;this.dx=0;this.t=null}
  a(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt)}
  filter(v,t){
    if(this.x===null){this.x=v;this.t=t;this.dx=0;return v}
    const dt=Math.max(1e-3,t-this.t);this.t=t;
    const d=(v-this.x)/dt; this.dx+=this.a(this.dC,dt)*(d-this.dx);
    const c=this.minC+this.beta*Math.abs(this.dx);
    this.x+=this.a(c,dt)*(v-this.x); return this.x;
  }
}

  spraying=handOK&&!rescueMode;

    let hit=false;

      if(Math.random()<.3)fx.push({k:'steam',x:c.x+rand(-c.r*.5,c.r*.5),y:c.y-rand(0,c.r*.6),vx:rand(-20,20),vy:rand(-90,-40),life:.8,max:.8});

      say(pickOne(['고마워요, 소방관님!','살았다! 고마워!','와! 구해 줘서 고마워!']))}

let camBusy=false;
async function startCamera(){
  if(cam.stream&&cam.lm){cam.status='ready';return}
  if(camBusy)return;camBusy=true;
  try{
    if(!window.isSecureContext)return camFail('https','isSecureContext=false');
    if(policyBlocksCamera())return camFail('embed','permissions-policy: camera 차단');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camFail(INAPP?'inapp':'nosupport','mediaDevices 없음');

      catch(e){const n=e&&e.name||'Error';lastErr='getUserMedia:'+n;
        if(/NotAllowed|Security|PermissionDenied/.test(n))return camFail(EMBED&&policyBlocksCamera()?'embed':INAPP?'inapp':EMBED?'embed':'denied',n);
        if(/NotReadable|TrackStart|Abort/.test(n))return camFail('busy',n);
        if(/NotFound|DevicesNotFound|Overconstrained/.test(n))return camFail('nocam',n);
        return camFail(INAPP?'inapp':'unknown',n+': '+(e.message||''))}
      const v=$('video');v.srcObject=cam.stream;try{await v.play()}catch(e){}
      const s=cam.stream.getVideoTracks()[0].getSettings();cam.res=(s.width||'?')+'×'+(s.height||'?');
    }
    cam.status='model';
    try{await modelP}catch(e){lastErr='model:'+(e&&e.message||e);return camFail('model',String(e&&e.message||e))}
    cam.status='ready';

  if(cam.lm)return Promise.resolve();

  modelPromise=(async()=>{
    const vision=await import(MP_JS);
    const files=await vision.FilesetResolver.forVisionTasks(MP_WASM);
    const mk=d=>vision.HandLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:MP_MODEL,delegate:d},runningMode:'VIDEO',numHands:1,
      minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
    try{cam.lm=await mk('GPU');cam.delegate='GPU'}catch(e){cam.lm=await mk('CPU');cam.delegate='CPU'}
  })();
  modelPromise.catch(()=>{modelPromise=null});

function processHand(L,now,vw=640,vh=480){
  if(!L){cam.hand=false;cam.pend=null;cam.pendN=0;return}
  cam.hand=true;cam.lastSeen=now;
  let px=0,py=0;for(const i of[0,5,9,13,17]){px+=L[i].x;py+=L[i].y}px/=5;py/=5;
  const mx=1-px;cam.px=mx;cam.py=py;
  const u=clamp((mx-.15)/.7,0,1),v=clamp((py-.12)/.7,0,1);
  const t=now/1000;
  target.x=ffx.filter(AIM.x0+u*(AIM.x1-AIM.x0),t);target.y=ffy.filter(AIM.y0+v*(AIM.y1-AIM.y0),t);
  const w=L[0],d=(a,b)=>Math.hypot((a.x-b.x)*vw,(a.y-b.y)*vh);let c=0;
  for(const[tip,pip]of[[8,6],[12,10],[16,14],[20,18]])if(d(L[tip],w)<d(L[pip],w))c++;
  cam.curl=c;
  const cand=c>=3?'fist':c<=1?'open':null;
  if(cand&&cand!==grip){if(cand===cam.pend)cam.pendN++;else{cam.pend=cand;cam.pendN=1}
    if(cam.pendN>=3){grip=cand;cam.pend=null;cam.pendN=0}}
  else{cam.pend=null;cam.pendN=0}
}

  busy:{i:'📵',t:'다른 앱이 카메라를 쓰고 있어요',s:['영상통화, 카메라 앱, 다른 탭의 카메라를 꺼 주세요.','그다음 <b>다시 해 보기</b>를 눌러요.']},
  nocam:{i:'📷',t:'카메라를 찾지 못했어요',s:['앞 카메라가 있는 휴대폰·태블릿에서 열어 주세요.']},
  embed:{i:'🖼️',t:'미리보기 화면 안에서는 카메라를 쓸 수 없어요',s:['이 화면은 카메라를 막아 둔 미리보기 창 안이에요.','게임 링크를 Chrome·Safari에서 직접 열면 손으로 할 수 있어요.','지금은 <b>손가락으로 하기</b>로 놀 수 있어요.']},
  model:{i:'📦',t:'손 인식 프로그램을 내려받지 못했어요',s:['인터넷 연결을 확인해 주세요. (와이파이가 막혀 있으면 모바일 데이터로)','처음 한 번은 몇 MB를 내려받아서 시간이 걸려요.','그다음 <b>다시 해 보기</b>를 눌러요.']},
  nosupport:{i:'🌐',t:'이 브라우저는 카메라를 지원하지 않아요',s:['최신 Chrome, 삼성 인터넷, Safari에서 열어 주세요.']},
  unknown:{i:'❓',t:'카메라를 켜지 못했어요',s:['브라우저를 껐다 켠 뒤 <b>다시 해 보기</b>를 눌러요.','계속 안 되면 화면 맨 아래 <b>진단</b> 줄을 알려 주세요.']}
};
let prevState='intro';
function camFail(cause,detail){
  cam.status='fail:'+cause;lastErr=cause+(detail?' ('+detail+')':'');
  const c=CE[cause]||CE.unknown;$('ceIcon').textContent=c.i;$('ceTitle').textContent=c.t;$('ceSteps').innerHTML=c.s.map(x=>'<li>'+x+'</li>').join('');
  const B=$('ceBtns');B.innerHTML='';
  const add=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;B.appendChild(b)};
  if(cause==='inapp'){
    add('Chrome으로 열기','red',()=>{const u=location.href;if(/KAKAOTALK/i.test(UA))location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);
      else if(/Android/i.test(UA))location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';else toast('메뉴에서 "Safari로 열기"를 눌러 주세요')});
    add('주소 복사','gray',()=>{try{navigator.clipboard.writeText(location.href).then(()=>toast('주소를 복사했어요'),()=>toast(location.href,6))}catch(e){toast(location.href,6)}});}
  if(cause!=='https'&&cause!=='nocam'&&cause!=='nosupport'&&cause!=='embed')add('↻ 다시 해 보기','',()=>{const ps=prevState;showOv(ps==='intro'?'intro':null);setState(ps);startCamera()});
  add('👆 손가락으로 하기','',()=>{setMode('finger');if(prevState==='play'){showOv(null);setState('play')}else{showOv('intro');setState('intro')}});
  add('🗺️ 지도로','gray',goHome);
  prevState=state==='camerr'?prevState:state;showOv('camerr');setState('camerr');
  return false;
}

// ================= 진단 줄 =================
let diagT=0;
function diag(){
  const o=x=>x?'O':'X';
  const parts=['진단: 모드='+(mode==='camera'?'카메라':'손가락'),'https='+o(window.isSecureContext),'임베드='+o(EMBED)+(policyBlocksCamera()?'(카메라차단)':''),'인앱='+o(INAPP)];
  if(mode==='camera'){parts.push('카메라='+(cam.stream?'켜짐 '+cam.res:cam.status),'모델='+(cam.lm?'준비('+cam.delegate+')':cam.status==='model'?'받는중':'-'),
    '손='+(cam.hand?'보임':'안보임'),'자세='+(grip==='fist'?'주먹':'손바닥')+'(굽힘'+(cam.curl<0?'-':cam.curl)+')','인식='+cam.det.toFixed(0)+'ms')}
  parts.push(fps+'fps','오류='+lastErr);
  $('diag').textContent=parts.join(' · ');
}

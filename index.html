<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8fd3ff">
<title>포크레인 기사님</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#6fbde8;color:#3a2a10;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;left:0;right:0;top:0;bottom:18px;display:flex;align-items:center;justify-content:center}
#game{display:block;touch-action:none;border-radius:6px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(8px,2vh) max(10px,3vw);background:rgba(255,246,222,.97);overflow:auto;z-index:20}
.ov.show{display:flex}
.box{width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2.2vh,16px);margin:auto}
.bear{width:clamp(56px,20vh,130px);height:clamp(56px,20vh,130px);flex:none}
h1{font-size:clamp(22px,8vh,46px);line-height:1.1;color:#b85c00;text-align:center}
.sub{font-size:clamp(13px,3.8vh,20px);text-align:center;line-height:1.35}
.row{display:flex;gap:clamp(6px,1.6vw,14px);width:100%;justify-content:center;flex-wrap:nowrap}
.card{flex:1 1 0;min-width:0;background:#fff;border-radius:16px;padding:clamp(6px,2vh,14px) 6px;
  box-shadow:0 4px 0 #e0b45a;border:3px solid #ffd27a;display:flex;flex-direction:column;align-items:center;gap:2px}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #e0b45a}
.card .ic{font-size:clamp(24px,10vh,52px);line-height:1.1}
.card .nm{font-size:clamp(13px,4.4vh,22px);font-weight:800;white-space:nowrap}
.card .sk{font-size:clamp(10px,3.2vh,15px);color:#8a6a3a;white-space:nowrap}
.card .st{font-size:clamp(10px,3.4vh,16px);min-height:1.2em}
.lbl{font-size:clamp(12px,3.6vh,17px);font-weight:700;color:#8a6a3a}
.mode{flex:1 1 0;min-width:0;max-width:240px;padding:clamp(5px,1.8vh,12px) 6px;border-radius:999px;background:#fff;
  border:3px solid #d9cbb0;font-size:clamp(12px,4vh,19px);font-weight:700;white-space:nowrap}
.mode.on{background:#ffcf33;border-color:#e09b00}
.btn{padding:clamp(7px,2.4vh,14px) clamp(14px,3vw,28px);border-radius:999px;background:#ffcf33;font-weight:800;
  font-size:clamp(14px,4.6vh,22px);box-shadow:0 4px 0 #d48a00;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d48a00}
.btn.gray{background:#eee;box-shadow:0 4px 0 #bbb}
.btn.blue{background:#7cc8ff;box-shadow:0 4px 0 #3c8fd0}
.talk{display:flex;align-items:center;gap:clamp(8px,2vw,20px);width:100%}
.bub{flex:1;background:#fff;border:3px solid #ffd27a;border-radius:20px;padding:clamp(8px,2.6vh,18px) clamp(10px,2vw,20px);
  font-size:clamp(15px,5vh,26px);line-height:1.4;font-weight:600}
.err .ic{font-size:clamp(30px,12vh,60px)}
.err h2{font-size:clamp(17px,6vh,30px);text-align:center;color:#c0392b}
.err ol{font-size:clamp(13px,4vh,19px);line-height:1.45;padding-left:1.4em;max-width:760px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stars{font-size:clamp(30px,13vh,70px);letter-spacing:6px}
#home{position:fixed;left:max(6px,env(safe-area-inset-left));top:6px;z-index:5;width:clamp(36px,11vh,52px);height:clamp(36px,11vh,52px);
  border-radius:50%;background:rgba(255,255,255,.85);font-size:clamp(18px,6vh,26px);display:none}
#gripBtn{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:clamp(22px,7vh,34px);z-index:5;
  width:clamp(64px,22vh,108px);height:clamp(64px,22vh,108px);border-radius:50%;background:#ffcf33;
  box-shadow:0 5px 0 #d48a00;font-size:clamp(14px,4.6vh,21px);font-weight:800;display:none;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#gripBtn b{font-size:clamp(26px,10vh,46px)}
#gripBtn.fist{background:#ff9f43;box-shadow:0 5px 0 #c0651a}
#bubble{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:8px;
  max-width:min(76vw,760px);background:#fff;border:3px solid #ffd27a;border-radius:18px;padding:4px 14px 4px 6px;
  font-size:clamp(13px,4.4vh,20px);font-weight:700;line-height:1.3;box-shadow:0 3px 8px rgba(0,0,0,.15);pointer-events:none}
#bubble svg{width:clamp(30px,10vh,48px);height:clamp(30px,10vh,48px);flex:none}
#toast{position:fixed;left:50%;bottom:clamp(26px,9vh,44px);transform:translateX(-50%);z-index:7;display:none;background:#333;color:#fff;
  padding:8px 16px;border-radius:12px;font-size:clamp(12px,3.8vh,17px);max-width:86vw;text-align:center}
#diag{position:fixed;left:0;right:0;bottom:0;z-index:30;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#fff;
  background:rgba(0,0,0,.55);padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#rotate{z-index:25;background:rgba(40,40,40,.93);color:#fff}
#rotate .sub{color:#fff}
#video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<video id="video" playsinline muted autoplay></video>
<button id="home" aria-label="처음으로">🏠</button>
<button id="gripBtn"><b>🖐</b><span>쏟기</span></button>
<div id="bubble"><span class="bslot"></span><span id="bubbleText"></span></div>
<div id="toast"></div>

<!-- 메뉴 -->
<div class="ov show" id="menu"><div class="box">
  <div class="talk" style="justify-content:center;width:auto">
    <span class="bslot bear"></span>
    <div><h1>포크레인 기사님</h1><div class="sub">곰 반장님이 일을 기다리고 있어요!</div></div>
  </div>
  <div class="row" id="cards"></div>
  <div class="lbl">조작 방법</div>
  <div class="row" id="modes">
    <button class="mode on" data-m="camera">✋ 손으로 하기</button>
    <button class="mode" data-m="tilt">📱 기울이기</button>
    <button class="mode" data-m="finger">👆 손가락으로</button>
  </div>
</div></div>

<!-- 일 소개 -->
<div class="ov" id="intro"><div class="box">
  <div class="talk"><span class="bslot bear"></span><div class="bub" id="introText"></div></div>
  <div class="sub" id="introHow"></div>
  <div class="btns"><button class="btn gray" id="introSay">🔊 다시 듣기</button><button class="btn" id="introGo">시작!</button></div>
</div></div>

<!-- 성공 -->
<div class="ov" id="win"><div class="box">
  <div class="stars" id="winStars"></div>
  <div class="talk"><span class="bslot bear"></span><div class="bub" id="winText"></div></div>
  <div class="btns"><button class="btn gray" id="winHome">🏠 처음으로</button><button class="btn blue" id="winAgain">↻ 다시 하기</button><button class="btn" id="winNext">다음 일 ▶</button></div>
</div></div>

<!-- 카메라 안내 -->
<div class="ov err" id="camerr"><div class="box">
  <div class="ic" id="ceIcon">📷</div>
  <h2 id="ceTitle"></h2>
  <ol id="ceSteps"></ol>
  <div class="btns" id="ceBtns"></div>
</div></div>

<div class="ov" id="rotate"><div class="box">
  <div style="font-size:clamp(40px,14vw,90px)">📱↻</div>
  <h1 style="color:#ffd54f">휴대폰을 가로로 돌려 주세요</h1>
  <div class="sub">가로 화면에서 더 크게 볼 수 있어요</div>
  <button class="btn" id="rotateSkip">그냥 할래요</button>
</div></div>

<div id="diag">진단: 시작 전</div>

<script>
'use strict';
// ================= 기본 설정 =================
const MP_JS   ='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const MP_WASM ='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const W=1280,H=720,GROUND=560;
const PIV={x:200,y:430},L1=470,L2=430;          // 붐/암 길이 (몸체는 무한궤도로 좌우 이동)
const PIVX0=200,PIVX1=640,TRACKV=600;
const REG={x0:300,x1:1235,y0:150,y1:690};        // 버킷 이동 범위
const MAXV=1000;                                  // 유압 속도 제한 px/s
const BOT=28;                                     // 버킷 중심→바닥
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const cv=$('game'),ctx=cv.getContext('2d');
const BEAR='<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="26" cy="44" r="15" fill="#8d5a2b"/><circle cx="94" cy="44" r="15" fill="#8d5a2b"/><circle cx="60" cy="70" r="42" fill="#a86b35"/><ellipse cx="60" cy="86" rx="21" ry="16" fill="#f1d3ae"/><ellipse cx="60" cy="79" rx="7.5" ry="5.5" fill="#3a2414"/><circle cx="44" cy="64" r="5.5" fill="#2b1a0e"/><circle cx="76" cy="64" r="5.5" fill="#2b1a0e"/><circle cx="45.5" cy="62.5" r="1.8" fill="#fff"/><circle cx="77.5" cy="62.5" r="1.8" fill="#fff"/><path d="M51 91 Q60 98 69 91" stroke="#3a2414" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="34" cy="80" r="6" fill="#e98b6d" opacity=".55"/><circle cx="86" cy="80" r="6" fill="#e98b6d" opacity=".55"/><path d="M18 46 Q60 -4 102 46 Z" fill="#ffc400"/><rect x="12" y="41" width="96" height="10" rx="5" fill="#ffab00"/><rect x="54" y="11" width="12" height="32" rx="5" fill="#ffe082"/></svg>';
document.querySelectorAll('.bslot').forEach(e=>e.innerHTML=BEAR);

// ================= 상태 =================
let state='menu';            // menu | intro | play | win | camerr
let mode='camera';           // camera | tilt | finger
let mi=0, M=null;            // 현재 미션
const target={x:760,y:330}, bucket={x:760,y:330,vx:0,vy:0,sp:0};
let grip='open';             // fist=담기 / open=쏟기
let bucketAng=2.1, load=0, particles=[], shake=0, elapsed=0;
let lastErr='-';

// ================= 화면 맞춤 =================
let scale=1,dpr=1,rotateSkipped=false;
function fit(){
  const vw=innerWidth,vh=innerHeight;
  scale=Math.min(vw/W,(vh-18)/H); dpr=Math.min(2,devicePixelRatio||1);
  cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  $('rotate').classList.toggle('show', vh>vw*1.05 && !rotateSkipped);
}
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,200));
$('rotateSkip').onclick=()=>{rotateSkipped=true;fit()};

// ================= 음성/말풍선 =================
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/^ko/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=1;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let bubbleT=0;
function say(t){speak(t);if(state==='play'){$('bubbleText').textContent=t;$('bubble').style.display='flex';bubbleT=Math.max(2.8,t.length*0.16)}}
const hintAt={};
function hint(k,t,cool=8){const n=performance.now()/1000;if(hintAt[k]&&n-hintAt[k]<cool)return;hintAt[k]=n;say(t)}
let toastT=0;function toast(t,s=3){$('toast').textContent=t;$('toast').style.display='block';toastT=s}
let actx=null;
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(0,actx.currentTime+i*.12);g.gain.linearRampToValueAtTime(.2,actx.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.12+.4);o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.12);o.stop(actx.currentTime+i*.12+.45)})}catch(e){}}

// ================= One-Euro 필터 =================
class OneEuro{
  constructor(minC=1.2,beta=0.008,dC=1){this.minC=minC;this.beta=beta;this.dC=dC;this.reset()}
  reset(){this.x=null;this.dx=0;this.t=null}
  a(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt)}
  filter(v,t){
    if(this.x===null){this.x=v;this.t=t;this.dx=0;return v}
    const dt=Math.max(1e-3,t-this.t);this.t=t;
    const d=(v-this.x)/dt; this.dx+=this.a(this.dC,dt)*(d-this.dx);
    const c=this.minC+this.beta*Math.abs(this.dx);
    this.x+=this.a(c,dt)*(v-this.x); return this.x;
  }
}
const fx=new OneEuro(),fy=new OneEuro();

// ================= 공통: 흙더미 =================
const PILE={cx:470,hw:110,h:120};
const pileTop=x=>GROUND-PILE.h*Math.max(0,1-((x-PILE.cx)/PILE.hw)**2);
const inPileX=x=>Math.abs(x-PILE.cx)<PILE.hw;
const inPile=()=>inPileX(bucket.x)&&bucket.y+BOT>pileTop(bucket.x)+8;
function scoopPile(dt){if(grip==='fist'&&load<1&&inPile()){load=Math.min(1,load+1.3*dt);return true}return false}
function drawPile(){
  ctx.fillStyle='#a8743f';ctx.beginPath();ctx.moveTo(PILE.cx-PILE.hw-10,GROUND+2);
  for(let x=PILE.cx-PILE.hw;x<=PILE.cx+PILE.hw;x+=6)ctx.lineTo(x,pileTop(x));
  ctx.lineTo(PILE.cx+PILE.hw+10,GROUND+2);ctx.fill();
  ctx.fillStyle='#8f6133';for(let i=0;i<14;i++){const x=PILE.cx-80+i*12;ctx.beginPath();ctx.arc(x,pileTop(x)+18+(i%3)*14,3,0,7);ctx.fill()}
}
const soilOf=amt=>amt; // 버킷 단위

// ================= 미션 1: 트럭 채우기 =================
const TR={x0:880,x1:1180,floor:GROUND-78,wall:135};const TU=TR.wall/4.5;
const M1={key:'truck',name:'트럭 채우기',icon:'🚚',skill:'양 맞추기',
  intro:'트럭에 흙을 노란 선까지 딱 맞게 채워 줄래? 버킷으로 세 번쯤 담으면 돼. 너무 많이 넣으면 다시 퍼내면 괜찮아!',
  init(){this.level=0;this.overs=0;this.overFlag=false;this.stable=0;this.fullT=0},
  inBed(x){return x>TR.x0+6&&x<TR.x1-6},
  surf(){return TR.floor-this.level*TU},
  floorY(x){if(inPileX(x))return GROUND-BOT+6;if(this.inBed(x))return this.surf()-BOT+12;return GROUND-BOT},
  update(dt){
    if(!scoopPile(dt)&&grip==='fist'&&load<1&&this.inBed(bucket.x)&&bucket.y+BOT>=this.surf()-14&&this.level>0){
      const t=Math.min(1.3*dt,this.level,1-load);this.level-=t;load+=t;}
    if(this.level>3.35&&!this.overFlag){this.overFlag=true;this.overs++;say('앗, 노란 선을 넘었어요! 버킷으로 조금 퍼내 볼까요?')}
    if(this.level<3.2)this.overFlag=false;
    if(load>=.99&&grip==='fist'){this.fullT+=dt;if(this.fullT>3)hint('full','흙이 가득! 트럭 위로 가서 손을 쫙 펴요',12)}else this.fullT=0;
    if(Math.abs(this.level-3)<=0.35&&load<0.05&&!particles.length)this.stable+=dt;else this.stable=0;
    if(this.stable>1.2)win(this.overs===0?3:this.overs<=2?2:1,'트럭이 딱 맞게 찼어요! 양 맞추기 대장이에요!');
  },
  onLand(p){if(this.inBed(p.x)&&p.y>=this.surf()){this.level=Math.min(4.5,this.level+p.amt);return true}return false},
  draw(){
    drawPile();
    // 트럭
    const f=TR.floor,top=f-TR.wall;
    ctx.fillStyle='#3d6fb6';ctx.fillRect(TR.x0-10,f,TR.x1-TR.x0+20,26);
    ctx.fillStyle='#4f86d6';ctx.fillRect(TR.x1+8,f-110,86,136);
    ctx.fillStyle='#cfefff';ctx.fillRect(TR.x1+22,f-96,58,46);
    for(const wx of [TR.x0+50,TR.x0+190,TR.x1+50]){ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(wx,f+34,26,0,7);ctx.fill();ctx.fillStyle='#bbb';ctx.beginPath();ctx.arc(wx,f+34,10,0,7);ctx.fill()}
    // 짐칸 속 흙
    const s=this.surf();ctx.fillStyle=this.level>3.35?'#c0703a':'#a8743f';
    ctx.fillRect(TR.x0+4,s,TR.x1-TR.x0-8,f-s);
    // 짐칸 벽
    ctx.strokeStyle='#e94f37';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(TR.x0,top);ctx.lineTo(TR.x0,f+3);ctx.lineTo(TR.x1,f+3);ctx.lineTo(TR.x1,top);ctx.stroke();
    // 노란 선
    const ly=f-3*TU;ctx.setLineDash([18,10]);ctx.strokeStyle='#ffd400';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(TR.x0-14,ly);ctx.lineTo(TR.x1+14,ly);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd400';ctx.strokeStyle='#5a4300';ctx.lineWidth=5;ctx.font='bold 30px sans-serif';ctx.textAlign='right';
    ctx.strokeText('여기까지!',TR.x0-20,ly+10);ctx.fillText('여기까지!',TR.x0-20,ly+10);
  },
  hud(){return'노란 선까지 흙을 채워요'}
};

// ================= 미션 2: 색깔 돌 정리 =================
const COL={r:'#e53935',b:'#1e88e5',y:'#fdd835'},CNAME={r:'빨간',b:'파란',y:'노란'};
const M2={key:'sort',name:'색깔 돌 정리',icon:'🔴🔵🟡',skill:'분류',
  intro:'공사장에 돌멩이가 흩어져 있어! 빨간 돌은 빨간 바구니에, 파란 돌은 파란 바구니에, 노란 돌은 노란 바구니에 넣어 줘.',
  init(){
    const c=['r','b','y','r','b','y'].sort(()=>Math.random()-.5);
    this.st=c.map((k,i)=>({c:k,x:375+i*64+rand(-8,8),y:GROUND-24,vx:0,vy:0,s:'g'}));
    this.bk=[{c:'r',x:830,n:0},{c:'b',x:990,n:0},{c:'y',x:1150,n:0}];this.held=null;this.wrong=0;
  },
  BW:136,BT:GROUND-95,
  floorY(){return GROUND-BOT},
  update(dt){
    if(this.held){if(grip==='open'&&bucketAng>.5){const h=this.held;h.s='f';h.vx=bucket.vx*.35;h.vy=Math.max(0,bucket.vy*.35);this.held=null}
      else{this.held.x=bucket.x;this.held.y=bucket.y-2}}
    else if(grip==='fist'&&bucketAng<.6){let best=null,bd=64;for(const s of this.st)if(s.s!=='in'){const d=Math.hypot(s.x-bucket.x,s.y-(bucket.y+8));if(d<bd){bd=d;best=s}}
      if(best){best.s='h';this.held=best}}
    for(const s of this.st){if(s.s!=='f')continue;const py=s.y;s.vy+=1500*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.x=clamp(s.x,320,1255);
      for(const b of this.bk){if(Math.abs(s.x-b.x)<this.BW/2-14&&s.y>=this.BT&&py<this.BT+40&&s.vy>0){

function update(dt){

  const want=clamp(target.x-560,PIVX0,PIVX1);PIV.x+=clamp(want-PIV.x,-TRACKV*dt,TRACKV*dt);
  clampTarget();stepBucket(dt);
  const ta=grip==='fist'?0:2.1;bucketAng+=clamp(ta-bucketAng,-6*dt,6*dt);
  if(grip==='open'&&load>0.001&&bucketAng>1){const a=Math.min(load,2.2*dt);load-=a;if(load<0.001)load=0;
    const n=Math.max(1,Math.ceil(a/0.02));for(let i=0;i<n;i++)particles.push({x:bucket.x+rand(-14,22)+20,y:bucket.y+rand(0,14),vx:bucket.vx*.3+rand(-40,40),vy:rand(40,140),amt:a/n})}
  M.update(dt);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.vy+=1400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if((M.onLand&&M.onLand(p))||p.y>=GROUND+(M===M4&&p.x>=RD.x0?RD.depth:0)||p.x<0||p.x>W)particles.splice(i,1)}

  if(shake>0)shake-=dt;if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)$('bubble').style.display='none'}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.display='none'}

const UA=navigator.userAgent||'';
const INAPP=/KAKAOTALK|NAVER\(inapp|NAVER|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|everytimeApp|Whale\/.*inapp|; wv\)/i.test(UA);
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function policyBlocksCamera(){try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&p.allowsFeature)return!p.allowsFeature('camera')}catch(e){}return false}
const cam={stream:null,lm:null,status:'off',delegate:'',hand:false,lastSeen:-1e9,px:.5,py:.5,curl:-1,pend:null,pendN:0,lastT:-1,det:0,detN:0,res:''};
let camBusy=false;
async function startCamera(){
  if(cam.stream&&cam.lm){cam.status='ready';return}
  if(camBusy)return;camBusy=true;
  try{
    if(!window.isSecureContext)return camFail('https','isSecureContext=false');
    if(policyBlocksCamera())return camFail('embed','permissions-policy: camera 차단');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camFail(INAPP?'inapp':'nosupport','mediaDevices 없음');
    cam.status='starting';
    const modelP=loadModel();               // 권한 묻는 동안 모델도 같이 받기
    if(!cam.stream){
      try{cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false})}
      catch(e){const n=e&&e.name||'Error';lastErr='getUserMedia:'+n;
        if(/NotAllowed|Security|PermissionDenied/.test(n))return camFail(EMBED&&policyBlocksCamera()?'embed':INAPP?'inapp':EMBED?'embed':'denied',n);
        if(/NotReadable|TrackStart|Abort/.test(n))return camFail('busy',n);
        if(/NotFound|DevicesNotFound|Overconstrained/.test(n))return camFail('nocam',n);
        return camFail(INAPP?'inapp':'unknown',n+': '+(e.message||''))}
      const v=$('video');v.srcObject=cam.stream;try{await v.play()}catch(e){}
      const s=cam.stream.getVideoTracks()[0].getSettings();cam.res=(s.width||'?')+'×'+(s.height||'?');
    }
    cam.status='model';
    try{await modelP}catch(e){lastErr='model:'+(e&&e.message||e);return camFail('model',String(e&&e.message||e))}
    cam.status='ready';
  }finally{camBusy=false}
}
let modelPromise=null;
function loadModel(){
  if(cam.lm)return Promise.resolve();
  if(modelPromise)return modelPromise;
  modelPromise=(async()=>{
    const vision=await import(MP_JS);
    const files=await vision.FilesetResolver.forVisionTasks(MP_WASM);
    const mk=d=>vision.HandLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:MP_MODEL,delegate:d},runningMode:'VIDEO',numHands:1,
      minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
    try{cam.lm=await mk('GPU');cam.delegate='GPU'}catch(e){cam.lm=await mk('CPU');cam.delegate='CPU'}
  })();
  modelPromise.catch(()=>{modelPromise=null});
  return modelPromise;
}
function stopCamera(){if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}cam.status='off';$('video').srcObject=null}
function camTick(now){
  if(cam.status!=='ready'||!cam.lm)return;const v=$('video');
  if(v.readyState<2||v.currentTime===cam.lastT)return;cam.lastT=v.currentTime;
  let r;const t0=performance.now();
  try{r=cam.lm.detectForVideo(v,now)}catch(e){lastErr='detect:'+(e.message||e);return}
  cam.det=performance.now()-t0;
  processHand(r&&r.landmarks&&r.landmarks[0],now,v.videoWidth||640,v.videoHeight||480);
}
// 손 랜드마크 → 버킷 목표/주먹·손바닥 (테스트에서도 직접 부름)
function processHand(L,now,vw=640,vh=480){
  if(!L){cam.hand=false;cam.pend=null;cam.pendN=0;return}
  cam.hand=true;cam.lastSeen=now;
  let px=0,py=0;for(const i of[0,5,9,13,17]){px+=L[i].x;py+=L[i].y}px/=5;py/=5;   // 손바닥 중심
  const mx=1-px;cam.px=mx;cam.py=py;                                               // 거울(좌우 반전)
  const u=clamp((mx-.15)/.7,0,1),v=clamp((py-.15)/.7,0,1);
  const t=now/1000;
  target.x=fx.filter(REG.x0+u*(REG.x1-REG.x0),t);target.y=fy.filter(REG.y0+v*(REG.y1-REG.y0),t);
  const w=L[0],d=(a,b)=>Math.hypot((a.x-b.x)*vw,(a.y-b.y)*vh);let c=0;
  for(const[tip,pip]of[[8,6],[12,10],[16,14],[20,18]])if(d(L[tip],w)<d(L[pip],w))c++;
  cam.curl=c;
  const cand=c>=3?'fist':c<=1?'open':null;
  if(cand&&cand!==grip){if(cand===cam.pend)cam.pendN++;else{cam.pend=cand;cam.pendN=1}
    if(cam.pendN>=3){grip=cand;cam.pend=null;cam.pendN=0}}
  else{cam.pend=null;cam.pendN=0}
}

    add('주소 복사','gray',()=>{try{navigator.clipboard.writeText(location.href).then(()=>toast('주소를 복사했어요'),()=>toast(location.href,6))}catch(e){toast(location.href,6)}});}
  if(cause!=='https'&&cause!=='nocam'&&cause!=='nosupport'&&cause!=='embed')add('↻ 다시 해 보기','',()=>{const ps=prevState;showOv(ps==='intro'?'intro':null);setState(ps);startCamera()});
  add('👆 손가락으로 하기','',()=>{setMode('finger');if(prevState==='play'){showOv(null);setState('play')}else{showOv('intro');setState('intro')}});
  add('🏠 처음으로','gray',goHome);
  prevState=state==='camerr'?prevState:state;showOv('camerr');setState('camerr');
  return false;
}
let prevState='intro';

// ================= 진단 줄 =================
let diagT=0;
function diag(){
  const o=x=>x?'O':'X';
  const parts=['진단: 모드='+({camera:'카메라',tilt:'기울이기',finger:'손가락'}[mode]),'https='+o(window.isSecureContext),'임베드='+o(EMBED)+(policyBlocksCamera()?'(카메라차단)':''),'인앱='+o(INAPP)];
  if(mode==='camera'){parts.push('카메라='+(cam.stream?'켜짐 '+cam.res:cam.status),'모델='+(cam.lm?'준비('+cam.delegate+')':cam.status==='model'?'받는중':'-'),
    '손='+(cam.hand?'보임':'안보임'),'자세='+(grip==='fist'?'주먹':'손바닥')+'(굽힘'+(cam.curl<0?'-':cam.curl)+')','인식='+cam.det.toFixed(0)+'ms')}
  if(mode==='tilt')parts.push('센서='+(tilt.got?'받는중 '+tilt.tx.toFixed(0)+'/'+tilt.ty.toFixed(0):'없음'));
  parts.push('버킷='+bucket.sp.toFixed(0)+'px/s',fps+'fps','오류='+lastErr);
  $('diag').textContent=parts.join(' · ');
}

// 테스트용 핸들
window.__fk={get state(){return state},get M(){return M},bucket,target,get grip(){return grip},set grip(v){grip=v},get load(){return load},processHand,cam,setMode,startMission,get particles(){return particles}};

renderCards();fit();requestAnimationFrame(frame);
